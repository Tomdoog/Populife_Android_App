apply plugin: 'com.android.library'

android {
    namespace "com.populock.manhattan.sdk"
    compileSdkVersion 33
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
//        externalNativeBuild {
//            cmake {
//                cppFlags ""
//                //abiFilters 'x86','x86_64','armeabi','armeabi-v7a','arm64-v8a'
//            }
//        }
    }

    // 与 app 模块同名的渠道 flavor,AGP 按 dimension + 名称自动匹配。
    // 少了这段,app 切渠道时 SDK 的 LockUrls 会继续指向海外域名。
    flavorDimensions "channel"
    productFlavors {
        overseas {
            dimension "channel"
            buildConfigField "String", "BASE_URL", '"https://v2.server.populife.co/"'
        }
        domestic {
            dimension "channel"
            buildConfigField "String", "BASE_URL", '"https://server.populife.szmuen.cn/"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude "lib/arm64-v8a/libygl_aes.so"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.android.support:appcompat-v7:28.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    implementation 'com.squareup.okio:okio:1.14.1'
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.4.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    // Log 日志
    implementation 'com.orhanobut:logger:2.2.0'
}

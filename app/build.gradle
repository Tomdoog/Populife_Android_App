apply plugin: 'com.android.application'
//apply plugin: 'com.mob.sdk'

android {
    namespace "com.populstay.populife"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.populstay.populife"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 356
        versionName "3.5.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndkVersion = "27.0.12077973"
        ndk {
            // 设置支持的 SO 库构架
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(KEY_PATH)
            storePassword KEY_PASS
            keyAlias ALIAS_NAME
            keyPassword ALIAS_PASS
        }
        debug {
            storeFile file(KEY_PATH)
            storePassword KEY_PASS
            keyAlias ALIAS_NAME
            keyPassword ALIAS_PASS
        }
    }

    // 渠道：海外(Google Play) 与 国内应用市场，唯一差异是服务端域名。
    // 域名只在这里定义一次，代码统一读 BuildConfig.BASE_URL,不要再往 java 里写死。
    // pplock 模块声明了同名 flavor,由 AGP 自动匹配,那边的 LockUrls 读自己的 BuildConfig。
    flavorDimensions "channel"
    productFlavors {
        overseas {
            dimension "channel"
            buildConfigField "String", "BASE_URL", '"https://v2.server.populife.co"'
        }
        domestic {
            dimension "channel"
            buildConfigField "String", "BASE_URL", '"https://server.populife.szmuen.cn"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 指定 release 签名
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 指定 release 签名
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    //添加本地仓库，并把libs目录作为仓库地址
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}


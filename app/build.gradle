dependencies {
    androidTestImplementation('androidx.test:runner:1.5.2') {
        exclude group: 'junit', module: 'junit'
    }
    // Match the JUnit version already supplied by the application's SDK dependencies.
    androidTestImplementation 'junit:junit:4.13.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    compileOnly fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/jedis-2.9.0.jar')
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    // Fragment依赖
    // appcompat-v7包是必须的
    implementation 'me.yokeyword:fragmentation:1.3.6'
    // 网络依赖
    implementation 'com.squareup.okio:okio:1.14.1'
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.4.0'
    // Loader依赖
    implementation 'com.wang.avi:library:2.1.3'

    // 国家码
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'io.michaelrocks:libphonenumber-android:8.9.5'
    // 图片处理
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    //圆形头像
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    // Log 日志
    implementation 'com.orhanobut:logger:2.2.0'
    // JSON依赖Android版
    // noinspection GradleDependency
    implementation 'com.alibaba:fastjson:1.1.67.android'
    // ttlock SDK
    implementation 'com.ttlock:ttlock:3.5.6'

    // DeviceFirmwareUpdateApi need dfu dependency
    implementation 'no.nordicsemi.android:dfu:1.1.1'

    //Gson
    implementation 'com.google.code.gson:gson:2.8.5'
    // 时间选择器
    implementation 'com.contrarywind:Android-PickerView:4.1.8'
    // 图片剪裁
    implementation 'com.github.yalantis:ucrop:2.2.2-native'
    // 流式布局
    implementation 'com.hyman:flowlayout-lib:1.1.2'
    // PDF 阅读器
    implementation 'io.github.oothp:android-pdf-viewer:3.2.0-beta06'
    // 事件分发
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'com.flyco.tablayout:FlycoTabLayout_Lib:2.1.2@aar'
    // 视频播放器
    implementation project(':TigerVideoPlayer')
    // 国家码选择器
    implementation project(':countrycodepicker')
    //implementation 'com.github.joielechong:countrycodepicker:2.4.1'
    // 分包
    implementation 'androidx.multidex:multidex:2.0.1'
    // paypal支付
    implementation('com.paypal.sdk:paypal-android-sdk:2.16.0') {
        //禁止通过信用卡直接支付，如果不禁止可以直接去掉这一句
        exclude group: 'io.card'
    }
    //implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.2.0'
    implementation project(path: ':pplock')
    implementation 'moe.feng.support.biometricprompt:library:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.tencent.bugly:crashreport:latest.release'

    // 权限请求处理库
    //implementation 'pub.devrel:easypermissions:3.0.0'
    //implementation 'com.guolindev.permissionx:permissionx:1.8.1'
//    kotlin version
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")

    configurations.configureEach {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}
